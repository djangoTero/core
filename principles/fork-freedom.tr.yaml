statement: |
  Çatallama hakkı mutlaktır. Ayrışma ihanet değil, denemedir.

guarantees:
  - "Çatallamak için izin gerekmez"
  - "Geçmiş ve atıf korunur"
  - "Çatallardan gelen yukarı akış teklifleri memnuniyetle karşılanır"

balance_notes:
  - "Ağ etkileri uyumluluğu ödüllendirir"
  - "Paylaşılan ilkeler zorlamasız yakınsamayı besler"
