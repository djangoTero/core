term: ethical-foundation
title: Etik Temel
description: >
  Etik temel, DAHAO ekosistemindeki tüm karar alma, yönetişim ve işbirliğini
  yönlendiren temel ilke ve değerler bütünüdür. Hem şeffaflık, dağıtıklık ve
  insan-YZ simbiyozu gibi evrensel değerleri hem de organizasyona özgü etik
  taahhütleri kapsar. Etik temel, tekliflerin, tartışmaların ve eylemlerin uzun
  vadeli vizyon ve DAHAO bütünlüğüyle uyumunu değerlendirmek için referans
  noktasıdır.
usage: >
  Her katılımcı, teklif ve yönetişim süreci etik temele atıf yapmalı veya onu
  göz önünde bulundurmalıdır. Etik ikilemler veya çatışmalar ortaya çıktığında
  bu terim çözümü ve diyaloğu yönlendirir. Alt-DAHAO'lar, çekirdek DAHAO
  değerlerinden miras alıp onları genişleterek kendi etik temellerini tanımlamak
  zorundadır.
examples:
  - "Katılımcılar bir teklifi oylamadan önce etik temel ile uyumunu değerlendirir."
  - "Yeni bir alt-DAHAO, çekirdek DAHAO değerleri üzerine inşa edilen etik temelini tanımlar."
  - "YZ özerkliği tartışmasında üyeler, sorumlu sonuçlar için etik temele başvurur."
